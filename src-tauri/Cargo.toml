[package]
name = "diskwizard"
version = "0.1.0"
description = "DiskWizard — data recovery. Rust core + Tauri 2 (WebView2) + React/TS Canvas UI."
authors = ["DiskWizard"]
edition = "2024"
rust-version = "1.99"

# The Tauri app crate is also the Cargo workspace root (the DiskGenie
# D10 pattern): `crates/` holds the engine layers so they build and
# unit-test on ANY host without linking a WebView shell —
#   dw-core    platform-independent recovery engine (no OS deps)
#   dw-win     Windows platform layer (raw IO, enumeration, SMART, FVE)
#   dw-license the DiskGenie-architecture licensing client
# `dw-win` is only wired on Windows targets; the app crate itself stays
# cross-compilable for core-side CI.
[workspace]
members = [
    "crates/dw-core",
    "crates/dw-license",
    "crates/dw-win",
    "crates/dw-cli",
]
resolver = "2"

[lib]
# The `_lib` suffix is necessary so the lib name stays unique and does
# not conflict with the bin name (Windows name clash, rust issue 8519).
name = "diskwizard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
dw-core = { path = "crates/dw-core" }
dw-license = { path = "crates/dw-license" }
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"
thiserror = "2"

[target.'cfg(windows)'.dependencies]
dw-win = { path = "crates/dw-win" }
# Direct Win32 calls in the app command layer (volume labels, free
# space) — same windows-rs family as dw-win.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
] }

[dev-dependencies]
# The live license E2E (tests/live_license_facts.rs): admin-API client
# + the real transport. Feature-gated test code; never in release.
reqwest = { version = "0.13", default-features = false, features = [
    "rustls",
    "blocking",
    "json",
] }

[features]
default = []
# The development simulation core (the session-1/2 mock): registered in
# place of the real engine for tour/CI-screenshot builds. NEVER enabled
# in NSIS/MSIX/production builds — the ui-screenshots workflow passes
# `--features sim` explicitly.
sim = []
# The real-core tour hook (QA-1): lets the CI "real-core tour" job seed
# a simulated Pro license through the REAL command surface so the tour
# can walk scan → results → recovery past the L6 license gate. The
# seeding body compiles ONLY behind this feature; every other build
# (including NSIS/MSIX release) links the one-line refusal arm. This is
# the DiskGenie donor pattern (`license_sim_set` compiles to a hard
# refusal in production builds) — no simulated-license logic ships.
ci-tour = []
# The LIVE license E2E (tests/live_license_facts.rs in this crate +
# dw-license/tests/live_license.rs): runs ONLY when explicitly enabled
# (`cargo test --features live-license-e2e`), never in the normal
# `cargo test` pass, never in NSIS/MSIX release builds (the release
# pipelines never pass this feature). The license-e2e workflow runs it
# against the deployed worker — the DiskGenie donor pattern.
live-license-e2e = ["dw-license/live-license-e2e"]

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = "allow"
# The product name "DiskWizard" and platform terms are CamelCase by
# design; backticking every occurrence hurts doc readability.
doc_markdown = "allow"

# Spec §16: strip symbols, fat LTO, single unit (the DiskGenie release
# recipe — same setting and setup).
[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
panic = "abort"
