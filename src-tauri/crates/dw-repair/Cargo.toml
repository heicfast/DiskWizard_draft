[package]
name = "dw-repair"
version = "0.1.0"
description = "DiskWizard file repair — the Fixo-engine chain translated: per-format grammar repair (JPEG/PNG/PDF/OOXML/MP4/GIF/BMP/TIFF/WebP/SVG) with the two-tier BasisRepair/SampleRepair model."
edition = "2024"
rust-version = "1.99"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
crc32fast = "1"
flate2 = "1"
memchr = "2.8.3"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = "allow"
doc_markdown = "allow"
# Container parsers: offsets/lengths are bounded by validated headers;
# truncation casts at these boundaries are deliberate.
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_lossless = "allow"
unreadable_literal = "allow"
match_same_arms = "allow"
items_after_statements = "allow"
must_use_candidate = "allow"
let_underscore_untyped = "allow"
assert_is_empty = "allow"
# The found_soi/found_eoi marker families are deliberately parallel.
similar_names = "allow"
# The marker-grammar walk is one state machine; splitting it hurts.
too_many_lines = "allow"
