[package]
name = "dw-core"
version = "0.1.0"
description = "DiskWizard core — the platform-independent data-recovery engine (scan, carve, grade, recover, sessions)."
edition = "2024"
rust-version = "1.99"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
parking_lot = "0.12"
flate2 = "1"
crc32fast = "1"
memchr = "2.8.3"
# The scan pipeline's worker→merger transport (RE CKernelQueue model:
# bounded channels, fair drain, timeout polls for live progress).
crossbeam-channel = "0.5"
# FAT family timestamps are LOCAL wall-clock (the Windows mount
# behavior); interpreting them needs the host timezone. clock+std
# only — no oldtime/serde baggage.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = "allow"
doc_markdown = "allow"
# Disk-format parsers: offsets/lengths are bounded by construction
# (sector math + on-disk headers checked before use); truncation
# casts are deliberate at these boundaries.
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
# Internal plumbing (ScanSink::on_progress) doesn't warrant docs.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# Style-only lints: `as u64` vs `u64::from` and literal grouping read
# better in sector-math contexts; identical match arms document intent.
cast_lossless = "allow"
unreadable_literal = "allow"
match_same_arms = "allow"
items_after_statements = "allow"
must_use_candidate = "allow"
let_underscore_untyped = "allow"
# assert!(x.is_empty()) is the idiomatic test form we want.
assert_is_empty = "allow"
