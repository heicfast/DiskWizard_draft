[package]
name = "dw-license"
version = "0.1.0"
description = "DiskWizard licensing client — Ed25519 entitlement tokens, HMAC-signed requests, posture state machine (the DiskGenie architecture)."
edition = "2024"
rust-version = "1.99"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ed25519-dalek = "3"
hmac = "0.13"
sha2 = "0.11"
# The network transport is feature-gated so the platform layer
# (dw-win) can depend on the type surface WITHOUT dragging rustls /
# aws-lc-sys into Linux→Windows cross-checks (aws-lc-sys needs the
# MSVC toolchain). The app crate uses default features (client on).
reqwest = { version = "0.13", default-features = false, features = [
    "rustls",
    "blocking",
    "json",
], optional = true }

[features]
default = ["client"]
# The reqwest blocking transport (`http::ReqwestLicense`). Off = the
# pure type/protocol/token surface only.
client = ["dep:reqwest"]
# The LIVE end-to-end license test (tests/live_license.rs): runs ONLY
# when explicitly enabled (`cargo test --features live-license-e2e`),
# never in the normal `cargo test` pass, never in NSIS/MSIX release
# builds (the release pipelines never pass this feature). Compiled in
# by the license-e2e workflow against the deployed worker — the
# DiskGenie donor pattern (diskgenie-v2/src-tauri/tests/live_license.rs).
live-license-e2e = ["client"]

[dev-dependencies]
tempfile = "3"
reqwest = { version = "0.13", default-features = false, features = [
    "rustls",
    "blocking",
    "json",
] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = "allow"
doc_markdown = "allow"
# Protocol plumbing: crypto helpers are self-evident.
missing_errors_doc = "allow"
items_after_statements = "allow"
redundant_closure_for_method_calls = "allow"
