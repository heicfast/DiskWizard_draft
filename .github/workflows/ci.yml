name: CI

# DiskWizard CI (the DiskGenie pipeline adapted): typecheck + unit
# tests on Linux, then the Windows NSIS bundle artifact. The MSIX
# Store package builds in msix-build.yml; the UI screenshot tour
# lives in ui-screenshots.yml.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (typecheck + unit tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: npm ci
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Production web build (never bundles the mock)
        run: npm run build

      - name: Unit tests
        run: npm test -- --run

  rust-core:
    name: Rust core (fmt + clippy + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable + clippy + rustfmt)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: "Gate: cargo fmt --check (engine crates)"
        run: cargo fmt --all -- --check
        working-directory: src-tauri

      - name: "Gate: clippy -D warnings (engine crates)"
        run: cargo clippy -p dw-core -p dw-license --all-targets -- -D warnings
        working-directory: src-tauri

      - name: "Gate: engine tests (dw-core + dw-license)"
        run: cargo test -p dw-core -p dw-license
        working-directory: src-tauri

      # M2 exit criterion (docs/architecture/phase-build-plan.md): the
      # ext engine must scan + recover ground-truth mkfs output, not
      # just hand-built structures. ubuntu runners ship e2fsprogs;
      # the ignored test soft-skips when the env var is absent.
      - name: "Gate: ext2 real-filesystem fixture (mkfs + debugfs)"
        run: |
          set -e
          dd if=/dev/zero of=/tmp/ext2.img bs=1M count=16 status=none
          mkfs.ext2 -q -F /tmp/ext2.img
          python3 -c "open('/tmp/seed.txt','wb').write(bytes((i*7+3)%251 for i in range(1000)))"
          debugfs -w -R "write /tmp/seed.txt /seed.txt" /tmp/ext2.img >/dev/null 2>&1
          ls -la /tmp/ext2.img
        working-directory: src-tauri
      - name: "Gate: ext2 fixture test (scan + byte-truth recovery)"
        run: cargo test -p dw-core ext2_real_mkfs_fixture -- --ignored --nocapture
        working-directory: src-tauri
        env:
          DW_EXT2_FIXTURE: /tmp/ext2.img

      # The Windows platform layer cross-checked from Linux: dw-win's
      # dependency closure is pure Rust (dw-license's reqwest client is
      # feature-gated OFF for dw-win), so `cargo check/clippy --target
      # x86_64-pc-windows-msvc` catches every Windows-only compile error
      # BEFORE the expensive Windows runners spin up. This gate exists
      # because a push once carried 20+ windows-rs API-signature errors
      # that only surfaced in the NSIS job.
      - name: "Gate: dw-win cross-check (windows-msvc target)"
        run: |
          cargo check -p dw-win --target x86_64-pc-windows-msvc
          cargo clippy -p dw-win --target x86_64-pc-windows-msvc -- -D warnings
        working-directory: src-tauri

  # Fast app-crate signal on a real Windows toolchain: check + clippy
  # for the FULL workspace (tauri tree + dw-license client + sim
  # feature) — minutes instead of the full NSIS bundle cycle. The
  # NSIS/MSIX jobs remain the authoritative release builds.
  windows-check:
    name: Windows app check (clippy, default + sim)
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable + clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: "Gate: cargo check (workspace, default features)"
        run: cargo check --workspace --target x86_64-pc-windows-msvc
        working-directory: src-tauri

      - name: "Gate: clippy -D warnings (engine crates, full client)"
        run: cargo clippy -p dw-core -p dw-license -p dw-win --target x86_64-pc-windows-msvc -- -D warnings
        working-directory: src-tauri

      - name: "Gate: cargo check (sim feature — the dev mock core)"
        run: cargo check --workspace --target x86_64-pc-windows-msvc --features sim
        working-directory: src-tauri

  windows-nsis:
    name: Windows NSIS bundle (real build)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: npm ci
        run: npm ci --no-audit --no-fund

      - name: Build the NSIS installer (release)
        # The app manifest embeds requireAdministrator — the installer
        # and the installed app request elevation (raw-disk access).
        # --target pins the triple so the bundle lands at
        # target/x86_64-pc-windows-msvc/release/bundle/nsis (the
        # DiskGenie release path).
        run: npx tauri build --target x86_64-pc-windows-msvc --bundles nsis
        timeout-minutes: 40
        env:
          CARGO_INCREMENTAL: "0"

      - name: Release packaging (versioned setup + portable + SHA256SUMS)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          $out = "dist-release"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $installer = Get-ChildItem src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis -Filter "*.exe" | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer not found" }
          Copy-Item $installer.FullName "$out/DiskWizard-$version-x64-setup.exe"
          $portable = "$out/portable"
          New-Item -ItemType Directory -Force -Path $portable | Out-Null
          Copy-Item src-tauri/target/x86_64-pc-windows-msvc/release/diskwizard.exe "$portable/DiskWizard.exe"
          @("DiskWizard portable. Runs without installing; WebView2 required.", "The portable exe requests administrator (raw-disk access).") | Set-Content "$portable/README.txt"
          Compress-Archive -Path $portable -DestinationPath "$out/DiskWizard-$version-x64-portable.zip" -Force
          Remove-Item $portable -Recurse -Force
          Get-ChildItem $out -File | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content "$out/SHA256SUMS.txt"
          Get-Content "$out/SHA256SUMS.txt"

      - name: Upload the Windows release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: diskwizard-windows-release
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            dist-release/*
          if-no-files-found: error
