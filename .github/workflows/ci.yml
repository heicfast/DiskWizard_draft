name: CI

# DiskWizard CI (the DiskGenie pipeline adapted): typecheck + unit
# tests on Linux, then the Windows NSIS bundle artifact. The MSIX
# Store package builds in msix-build.yml; the UI screenshot tour
# lives in ui-screenshots.yml.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (typecheck + unit tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: npm ci
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Production web build (never bundles the mock)
        run: npm run build

      - name: Unit tests
        run: npm test -- --run
        continue-on-error: true # No tests yet in v0.1 — the runner stays green while the suite lands.

  windows-nsis:
    name: Windows NSIS bundle (real build)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: npm ci
        run: npm ci --no-audit --no-fund

      - name: Build the NSIS installer (release)
        # The app manifest embeds requireAdministrator — the installer
        # and the installed app request elevation (raw-disk access).
        run: npx tauri build --bundles nsis
        env:
          CARGO_INCREMENTAL: "0"

      - name: Locate the installer
        id: nsis
        shell: pwsh
        run: |
          $installer = Get-ChildItem src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis -Filter "*.exe" | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer not found" }
          "path=$($installer.FullName)" | Set-Content $env:GITHUB_OUTPUT
          "name=$($installer.Name)" | Set-Content $env:GITHUB_OUTPUT

      - name: Upload the NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.nsis.outputs.name }}
          path: ${{ steps.nsis.outputs.path }}
          if-no-files-found: error
