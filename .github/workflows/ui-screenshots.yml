name: UI Screenshots

# The Windows screenshot workflow ("one for one page/mode/action" —
# the DiskGenie harness adapted). Builds the REAL app (release,
# embedded frontend), launches with DISKWIZARD_TOUR=1, and captures
# EXACTLY ONE NAMED FRAME PER TOUR STEP via the title-sync channel
# (the TourDriver stamps `tNN-name` into the window title; the harness
# polls it, lets the step settle, and shoots).
#
# The tour itself drives the full state matrix through the mock-core
# command surface — including the license lifecycle (the gate dialog,
# then license_sim_set seeding Pro) — so both the working app AND the
# unlicensed gate states are captured with the release build.

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: ui-screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Node cache
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: npm ci
        run: npm ci --no-audit --no-fund

      - name: Build the app (release exe, sim core, no installer)
        run: npx tauri build --no-bundle -- --features sim
        env:
          CARGO_INCREMENTAL: "0"

      - name: Run the app + capture the tour (title-synced, one frame per step)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.Drawing
          Add-Type -AssemblyName System.Windows.Forms
          # Bump the runner display to 1920x1080 so the capture shows the
          # COMPLETE app window (the default 1024x768 runner display used
          # to crop the right side of the window). Non-fatal: fall back to
          # the default resolution if the cmdlet is unavailable.
          try {
            Set-DisplayResolution -Width 1920 -Height 1080 -Force | Out-Null
            "display set to 1920x1080"
          } catch {
            "display resolution change unavailable ($($_.Exception.Message)) - capturing at default"
          }
          $exe = Join-Path $PWD "src-tauri\target\release\diskwizard.exe"
          if (-not (Test-Path $exe)) { throw "exe not found: $exe" }
          $env:DISKWIZARD_TOUR = '1'
          $out = Join-Path $env:RUNNER_TEMP 'shots'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $app = Start-Process -FilePath $exe -WorkingDirectory $PWD -RedirectStandardOutput "$env:RUNNER_TEMP\app-stdout.log" -RedirectStandardError "$env:RUNNER_TEMP\app-stderr.log" -PassThru
          # bring to front
          $ws = New-Object -ComObject WScript.Shell
          $null = $ws.AppActivate($app.Id)
          # Boot settle: splash (~2.2 s) + the elevation gate auto-pass
          # (the packaged process is already elevated) + WebView2 first
          # paint; the first title marker appears with tour step 1.
          Start-Sleep -Milliseconds 6000
          $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds

          function Shoot([string]$name) {
            $bmp = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
            $bmp.Save((Join-Path $out $name), [System.Drawing.Imaging.ImageFormat]::Png)
            $g.Dispose(); $bmp.Dispose()
          }
          function WindowTitle() {
            # MainWindowTitle caches; Refresh() re-reads from Win32.
            $app.Refresh()
            return $app.MainWindowTitle
          }

          # TITLE-SYNCED capture: the TourDriver stamps each step into
          # the window title (`DiskWizard · tNN-name`); poll it and shoot
          # exactly ONE named frame per step - no duplicates, no misses,
          # "one for one page/mode/action". DEDUP HARDENING: a strict
          # slug charset stops at any Windows title decoration, and the
          # captured-marker set guarantees a step is only ever shot once
          # no matter how the title flickers.
          $deadline = (Get-Date).AddMinutes(12)
          $lastTitle = ''
          $frames = 0
          $sawMarker = $false
          $shot = New-Object 'System.Collections.Generic.HashSet[string]'
          while ((Get-Date) -lt $deadline -and -not $app.HasExited) {
            $t = WindowTitle
            if ($t -and $t -ne $lastTitle) {
              if ($t -like '*tour-complete') { "tour finished after $frames frames"; break }
              if ($t -match '· (t\d{2}-[a-z0-9-]+)') {
                $marker = $Matches[1]
                if (-not $shot.Contains($marker)) {
                  # Settle: let the view-transition settle-in + any
                  # crossfade land before the frame.
                  Start-Sleep -Milliseconds 1400
                  if ($app.HasExited) { break }
                  Shoot(($marker + '.png'))
                  $null = $shot.Add($marker)
                  $frames++
                  $sawMarker = $true
                  "captured $marker"
                }
              } elseif (-not $sawMarker) {
                # Pre-tour boot frame (splash / elevation gate).
                Shoot('t00-boot.png'); $frames++
                "captured t00-boot (pre-tour)"
              }
              $lastTitle = $t
            }
            Start-Sleep -Milliseconds 250
          }

          # FALLBACK: no title markers (tour env missing / title sync
          # broken) - the old cadence capture so the run never yields
          # zero artifacts.
          if (-not $sawMarker) {
            "no tour title markers - falling back to cadence capture"
            $step = 0
            while ($step -lt 48 -and -not $app.HasExited) {
              Start-Sleep -Milliseconds 2600
              Shoot(('step-{0:d2}.png' -f $step))
              $step++
            }
          }
          if (-not $app.HasExited) { Stop-Process -Id $app.Id -Force }
          Start-Sleep -Milliseconds 500
          # Rust panics + tracing land in stderr; the webview console is
          # not reachable from the harness - these logs make the next
          # hang/blank diagnosis a download instead of a guess.
          if (Test-Path "$env:RUNNER_TEMP\app-stderr.log") {
            "--- app-stderr tail ---"
            Get-Content "$env:RUNNER_TEMP\app-stderr.log" -Tail 40
          }
          Get-ChildItem $out | ForEach-Object { "captured $($_.Name)" }

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: diskwizard-ui-screenshots
          path: ${{ runner.temp }}/shots
          retention-days: 14
          if-no-files-found: error

      - name: Upload app logs
        uses: actions/upload-artifact@v4
        with:
          name: diskwizard-app-logs
          path: |
            ${{ runner.temp }}/app-stdout.log
            ${{ runner.temp }}/app-stderr.log
          retention-days: 14
          if-no-files-found: warn
