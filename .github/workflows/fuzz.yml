name: Fuzz

# SOP §12.3: cargo-fuzz on every parser — zero panics, zero unbounded
# allocations. Short runs ride every push; the weekly schedule goes
# deep. Crash artifacts upload for triage.

on:
  workflow_dispatch:
    inputs:
      seconds:
        description: "Seconds per target"
        default: "90"
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * 0" # Sundays 03:00 UTC — the deep run

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    name: cargo-fuzz / ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { dir: src-tauri/crates/dw-core/fuzz, target: carve }
          - { dir: src-tauri/crates/dw-core/fuzz, target: ntfs }
          - { dir: src-tauri/crates/dw-core/fuzz, target: fat }
          - { dir: src-tauri/crates/dw-core/fuzz, target: exfat }
          - { dir: src-tauri/crates/dw-core/fuzz, target: ext }
          - { dir: src-tauri/crates/dw-core/fuzz, target: hfsplus }
          - { dir: src-tauri/crates/dw-core/fuzz, target: refs }
          - { dir: src-tauri/crates/dw-core/fuzz, target: partition }
          - { dir: src-tauri/crates/dw-core/fuzz, target: repair }
          - { dir: src-tauri/crates/dw-core/fuzz, target: scan_pipeline }
          - { dir: src-tauri/crates/dw-repair/fuzz, target: engines }
          - { dir: src-tauri/crates/dw-repair/fuzz, target: salvage }
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (nightly — the sanitizer profile)
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.dir }}

      - name: Install cargo-fuzz (latest)
        run: cargo install cargo-fuzz --locked

      - name: Fuzz ${{ matrix.target }}
        run: |
          secs="${{ github.event.inputs.seconds }}"
          if [ -z "$secs" ]; then secs=90; fi
          DICT=""
          if [ -f dw.dict ]; then DICT="-dict=dw.dict"; fi
          cargo fuzz run ${{ matrix.target }} -- -max_total_time="$secs" -rss_limit_mb=4096 -timeout=10 -max_len=1048576 $DICT
        shell: bash
        working-directory: ${{ matrix.dir }}
        env:
          RUSTUP_TOOLCHAIN: nightly

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: crash-${{ matrix.target }}
          path: ${{ matrix.dir }}/artifacts
          if-no-files-found: ignore
